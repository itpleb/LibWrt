name: Build JDCloud RE-CS-02

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync \
            swig unzip zlib1g-dev file wget libelf-dev

      - name: Add plugin feeds
        run: |
          cat >> feeds.conf.default <<'EOF'
          src-git openclash https://github.com/vernesong/OpenClash.git;master
          src-git istore https://github.com/linkease/istore.git;main
          src-git nas https://github.com/linkease/nas-packages.git;master
          src-git nas_luci https://github.com/linkease/nas-packages-luci.git;main
          EOF
          ./scripts/feeds update -a
          ./scripts/feeds install -d y -p openclash luci-app-openclash
          ./scripts/feeds install -d y -p istore luci-app-store
          ./scripts/feeds install -d y -p nas quickstart
          ./scripts/feeds install -d y -p nas_luci luci-app-quickstart

      - name: Configure JDCloud RE-CS-02
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq60xx=y
          CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re-cs-02=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_luci-app-store=y
          CONFIG_PACKAGE_luci-app-quickstart=y
          CONFIG_PACKAGE_quickstart=y
          CONFIG_PACKAGE_luci-compat=y
          EOF
          make defconfig
          for option in \
            CONFIG_TARGET_qualcommax \
            CONFIG_TARGET_qualcommax_ipq60xx \
            CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re-cs-02 \
            CONFIG_PACKAGE_luci \
            CONFIG_PACKAGE_luci-app-openclash \
            CONFIG_PACKAGE_luci-app-store \
            CONFIG_PACKAGE_luci-app-quickstart \
            CONFIG_PACKAGE_quickstart \
            CONFIG_PACKAGE_luci-compat; do
            grep -qx "${option}=y" .config || {
              echo "Required configuration missing: ${option}"
              exit 1
            }
          done

      - name: Download sources
        run: make download -j"$(nproc)"

      - name: Build firmware
        run: make -j"$(nproc)"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: jdcloud-re-cs-02-firmware
          path: bin/targets/qualcommax/ipq60xx/
          if-no-files-found: error
